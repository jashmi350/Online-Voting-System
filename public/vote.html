<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cast Your Vote</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Official Ballot Paper</h1>
    <span id="displayUser"></span>
  </header>
  <div class="container">
    <h2>Make Your Choice</h2>
    <p>Review candidate profiles and manifestos before casting your final vote. Votes are permanent and anonymous.</p>
    <br>
    <form id="votingForm">
      <div id="ballotContainer">Loading candidates...</div>
      <button type="submit" style="margin-top: 20px;">Submit Final Secure Vote</button>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
