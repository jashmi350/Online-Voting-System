<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>College Voting System - Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Campus Vote 2026</h1>
    <nav>
      <a href="results.html">Live Results</a>
      <a href="admin.html">Admin Panel</a>
    </nav>
  </header>

  <div class="container" style="text-align: center; padding: 60px 40px;">
    <h2>College Election Portal</h2>
    <p style="margin-top: 10px; margin-bottom: 30px;">Cast your secure vote for Class Representative, Student Council Head, and Student President.</p>
    <button id="openModalBtn" style="max-width: 250px; margin: 0 auto; font-size: 1.1rem; padding: 14px 24px;">Student Login & Vote</button>
  </div>

  <!-- Student Login Popup Modal (Hidden by default) -->
  <div id="studentModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(8px); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: #ffffff; padding: 40px; border-radius: 16px; width: 90%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); position: relative;">
      <h3 style="color: #0f172a; margin-bottom: 10px; font-size: 1.4rem;">Student Verification</h3>
      <p style="margin-bottom: 20px; font-size: 0.9rem;">Enter your unique Student ID to cast your ballot.</p>
      
      <div class="form-group" style="text-align: left;">
        <label for="studentId">Student ID Number:</label>
        <input type="text" id="studentId" placeholder="e.g. CS2026001">
      </div>
      
      <button id="modalLoginBtn" style="margin-top: 10px;">Proceed to Ballot</button>
      <button id="closeModalBtn" style="background: #e2e8f0; color: #475569; margin-top: 10px;">Cancel</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
